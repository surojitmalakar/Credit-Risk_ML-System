[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msme-ews"
version = "0.1.0"
description = "MSME financial distress early warning and credit intelligence system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "shap>=0.45,<1",
    "matplotlib>=3.8,<4",
    "plotly>=5.18,<7",
    "streamlit>=1.32,<2",
    "joblib>=1.3,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "reportlab>=4,<5",
    "xlrd>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
