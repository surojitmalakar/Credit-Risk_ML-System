[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msme-ews"
version = "0.1.0"
description = "MSME financial distress early warning and credit intelligence system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "reportlab>=4,<5",
    "xlrd>=2,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
